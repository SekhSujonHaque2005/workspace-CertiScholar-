version: '3.8'

services:
  # PostgreSQL 16 - Relational System of Record (ACID compliant)
  postgres:
    image: postgres:16-alpine
    container_name: certischolar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certischolar_db
      POSTGRES_USER: certischolar_user
      POSTGRES_PASSWORD: certischolar_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certischolar_user -d certischolar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 - Channel Layer for WebSockets, Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: certischolar_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Mailpit - Local Mock SMTP server for testing notification emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: certischolar_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI to view emails
      - "1025:1025" # SMTP server

volumes:
  postgres_data:
  redis_data:
